[package]
name = "claude-api"
version = "0.5.0-dev"
edition = "2024"
license = "MPL-2.0"
description = "Anthropic API endpoints, headers and Claude Code credentials, in one place"
repository = "https://github.com/wdes/tab-atelier"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The blocking transport, shared by tab-atelier and tab-atelier-proxy. Optional
# because catbus-agent is async/reqwest and wants only the constants, headers
# and credential schema — pulling ureq in there would add a second TLS stack to
# a crate that already has one.
ureq = { version = "3", features = ["json"], optional = true }

[features]
default = ["ureq"]
ureq = ["dep:ureq"]

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

[lints.rust]
unsafe_code = "forbid"
