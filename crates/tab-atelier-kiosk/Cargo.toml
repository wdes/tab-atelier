[package]
name = "tab-atelier-kiosk"
version = "0.1.0-dev"
edition = "2024"
license = "MPL-2.0"
description = "Web kiosk for tab-atelier"
repository = "https://github.com/wdes/tab-atelier"
publish = false

[[bin]]
name = "tab-atelier-kiosk"
path = "src/main.rs"

[lib]
name = "tab_atelier_kiosk"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
bytes = "1"
# Named here, not re-exported through `-api`, because the attribute macros are
# not re-exportable: `rocket_codegen` hardcodes `::rocket::` into every `#[get]`,
# `#[catch]` and `routes!` it expands, and an absolute path only resolves against
# a crate in this crate's own extern prelude. The re-export still carries okapi
# and schemars, whose macros use relative paths.
rocket = { version = "0.5.1", features = ["json"] }
# Same reason as `rocket`: `#[openapi]` and `routes_spec!` expand to absolute
# `::rocket_okapi::…` paths, which only resolve against a crate in this crate's
# extern prelude. The re-export through `-api` carries the types; it cannot
# carry the macro's absolute path.
rocket_okapi = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The shared HTTP rules: the Rocket scaffold, the request/response/resource
# contracts, the guards, the derived OpenAPI. `rocket` and `rocket_okapi` are
# named above only because their attribute macros expand to absolute paths;
# every type the Kiosk uses — the guards, the `Reply`, the resources, the
# spec — comes from here, and hyper, http and schemars the app never names at
# all.
tab-atelier-api = { path = "../tab-atelier-api" }
# The shared round-robin pacing: the same sweep brain.rs uses, so a fan-out
# (the agent broadcast) is spread over time instead of arriving as a herd.
tab-atelier-pace = { path = "../tab-atelier-pace" }
# The shared serving layer: serve the UI from a web root. Its Own
# types come back through it.
tab-atelier-web = { path = "../tab-atelier-web" }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "sync", "time", "io-util", "macros", "signal"] }
ureq = { version = "3", features = ["json"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

[lints.rust]
unsafe_code = "forbid"

[package.metadata.deb]
name = "tab-atelier-kiosk"
maintainer = "William Desportes <williamdes@wdes.fr>"
copyright = "2026, William Desportes <williamdes@wdes.fr>"
license-file = ["../../LICENSE", "0"]
extended-description = "The tab-atelier web Kiosk: decision, report and intent panes, over HTTP."
section = "utils"
priority = "optional"
# The Kiosk is a standalone server package, not part of the desktop install.
# Keep init-system-helpers explicit because maintainer scripts use deb-systemd-invoke on upgrades.
depends = "$auto, adduser, init-system-helpers"
assets = [
    ["target/release/tab-atelier-kiosk", "/usr/bin/", "755"],
    ["systemd/tab-atelier-kiosk.service", "/usr/lib/systemd/system/", "644"],
    ["README.md", "/usr/share/doc/tab-atelier-kiosk/", "644"],
    # The UI is served from a web root, not compiled in, so the package ships
    # it. Globs, so the only files here are the ones a browser loads — the
    # `tests/`, `run-tests.sh` and `package.json` beside them are not matched.
    ["assets/*.html", "/usr/share/tab-atelier-kiosk/web/", "644"],
    ["assets/*.css", "/usr/share/tab-atelier-kiosk/web/", "644"],
    ["assets/*.js", "/usr/share/tab-atelier-kiosk/web/", "644"],
]
maintainer-scripts = "debian/"
systemd-units = { unit-name = "tab-atelier-kiosk", enable = true, start = true }
