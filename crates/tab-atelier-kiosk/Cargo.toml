[package]
name = "tab-atelier-kiosk"
version = "0.1.0-dev"
edition = "2024"
license = "MPL-2.0"
description = "Web kiosk for tab-atelier"
repository = "https://github.com/wdes/tab-atelier"
publish = false

[[bin]]
name = "tab-atelier-kiosk"
path = "src/main.rs"

[lib]
name = "tab_atelier_kiosk"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
# The server side of the hop: hyper terminates the browser connection, ureq is
# the blocking client to the daemon. Same pair as `tab-atelier-proxy`, and for
# the same reason — the request is read, replayed and handed back, so async buys
# nothing on that side and ureq keeps the tree small.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
serde_json = "1"
ureq = { version = "3" }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "sync", "time", "io-util", "macros", "signal"] }
# `stream::poll_fn` bridges the blocking reader thread to the SSE body hyper
# streams back. `std` is what exposes it.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

[lints.rust]
unsafe_code = "forbid"

[package.metadata.deb]
name = "tab-atelier-kiosk"
maintainer = "William Desportes <williamdes@wdes.fr>"
copyright = "2026, William Desportes <williamdes@wdes.fr>"
license-file = ["../../LICENSE", "0"]
extended-description = "The tab-atelier web Kiosk: decision, report and intent panes, over HTTP."
section = "utils"
priority = "optional"
# The Kiosk is a standalone server package, not part of the desktop install.
# Keep init-system-helpers explicit because maintainer scripts use deb-systemd-invoke on upgrades.
depends = "$auto, adduser, init-system-helpers"
assets = [
    ["target/release/tab-atelier-kiosk", "/usr/bin/", "755"],
    ["systemd/tab-atelier-kiosk.service", "/usr/lib/systemd/system/", "644"],
    ["README.md", "/usr/share/doc/tab-atelier-kiosk/", "644"],
]
maintainer-scripts = "debian/"
systemd-units = { unit-name = "tab-atelier-kiosk", enable = false, start = false }

[dev-dependencies]
# Test-only: the intentions module writes to a directory, and each test wants
# one of its own rather than a shared path that parallel runs would race on.
tempfile = "3"
