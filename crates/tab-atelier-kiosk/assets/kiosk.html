<!doctype html>
<!-- SPDX-License-Identifier: MPL-2.0 -->
<!-- Harness control panel — Kiosk + Catalogue only (fungal-mode trim).
     Vanilla JS, no build step. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <!-- Kiosk deploy seam: base for turning a decision's code-source ref (`src/…:line`) into a
       clickable repo blob link. EMPTY on purpose: the fork that carried the outbox 404'd
       (outbox isn't in the repo), so a code ref degrades to honest copyable text. Set this to
       the durable repo (e.g. wdes/tab-atelier:<branch>) once a branch does carry it, to
       re-enable clickable blobs. See classifyDecisionFile in kiosk.js. -->
  <meta name="repo-blob-base" content="">
  <!-- Remote link: the public host a report viewer link is composed onto so it can
       open/copy it off-LAN (the CF tunnel + its auth are the PO's infra, not ours). DEFAULTS to
       empty by default; a deployment points it at its own host. See toRemoteLink in kiosk.js. -->
  <meta name="remote-base" content="">
  <title>Harness kiosk · tab-atelier</title>
  <link rel="stylesheet" href="/assets/kiosk.css">
</head>
<body>
  <header class="topbar">
    <h1>Harness</h1>
    <!-- Two views over the same fleet data: the Dashboard (cards grouped into
         phase lanes) is the default; Flotte is the per-server list you manage
         from. Remembered in localStorage, overridable with `?view=`. -->
    <nav id="view-switch" class="view-switch" aria-label="vue">
      <button class="view-btn" data-view="dashboard">Dashboard</button>
      <button class="view-btn" data-view="fleet">Flotte</button>
    </nav>
    <span id="status" class="status" aria-live="polite">prêt</span>
    <!-- Catalogue: opens the cold catalog read-model in a separate overlay
         (a skill is NOT a live tab — distinct visual vocabulary). -->
    <button id="catalog-toggle" class="catalog-toggle" aria-controls="catalog-panel">Catalogue</button>
    <!-- Kiosk: the cross-project PENDING-DECISIONS panel, a separate cold
         source fetched on-demand. The badge = nb of open decisions; hidden when zero. -->
    <button id="kiosk-toggle" class="kiosk-toggle" aria-controls="kiosk-panel">Kiosk<span id="kiosk-badge" class="kiosk-badge" hidden>0</span></button>
    <!-- Serveurs: the servers this Kiosk aggregates, and their tabs. A separate
         page, opened by a button rather than an anchor, so it answers like the
         toggles beside it. The handler carries the page's `?token=` onto the
         destination — the serveurs screen answers 401 without it. -->
    <button id="manage-toggle" class="manage-toggle">Serveurs</button>
  </header>

  <!-- The landing view: every server this Kiosk aggregates and its tabs, so the
       tabs are the first thing on screen rather than behind the Serveurs page.
       Populated by kiosk.js from GET /kiosk/fleet. -->
  <main id="fleet" aria-label="serveurs et onglets"></main>

  <!-- Catalogue: the cold catalog read-model, opened on-demand from the
       topbar button. Populated by kiosk.js from catalogView(readModel). -->
  <div id="catalog-panel" class="catalog-panel" role="dialog" aria-label="catalogue des skills" hidden></div>

  <!-- Kiosk: the cross-project pending-decisions read-model, opened
       on-demand from the topbar. Populated by kiosk.js from kioskView(readModel). -->
  <div id="kiosk-panel" class="kiosk-panel" role="dialog" aria-label="décisions en attente" hidden></div>

  <!-- Confirm for destructive actions (closing a tab). OUR markup, styled with
       the page — not the browser's window.confirm(). The native <dialog> gives
       the modal semantics (backdrop, focus trap, Esc) without a library. -->
  <dialog id="confirm-modal" class="confirm-modal">
    <p id="confirm-message"></p>
    <form method="dialog" class="confirm-actions">
      <button value="cancel" class="confirm-cancel">Annuler</button>
      <button value="ok" class="confirm-ok">Confirmer</button>
    </form>
  </dialog>

  <script type="module" src="/assets/kiosk.js"></script>
</body>
</html>
