<!doctype html>
<!-- SPDX-License-Identifier: MPL-2.0 -->
<!-- Harness control panel — Kiosk + Catalogue only (fungal-mode trim).
     Vanilla JS, no build step. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <!-- Kiosk deploy seam: base for turning a decision's code-source ref (`src/…:line`) into a
       clickable repo blob link. EMPTY on purpose: the old
       a-biskoazh fork 404'd (outbox isn't in the repo), so a code ref degrades to honest
       copyable text. Set this to the durable repo (e.g. wdes/tab-atelier:tab-atelier-mx) once
       the durability push lands to re-enable clickable blobs. See classifyDecisionFile in kiosk.js. -->
  <meta name="repo-blob-base" content="">
  <!-- Remote link: the public host a report viewer link is composed onto so it can
       open/copy it off-LAN (the CF tunnel + its auth are the PO's infra, not ours). DEFAULTS to
       empty by default; a deployment points it at its own host. See toRemoteLink in kiosk.js. -->
  <meta name="remote-base" content="">
  <title>Harness kiosk · tab-atelier</title>
  <link rel="stylesheet" href="/assets/kiosk.css">
</head>
<body>
  <header class="topbar">
    <h1>Harness</h1>
    <span id="status" class="status" aria-live="polite">prêt</span>
    <!-- Catalogue: opens the cold catalog read-model in a separate overlay
         (a skill is NOT a live tab — distinct visual vocabulary). -->
    <button id="catalog-toggle" class="catalog-toggle" aria-controls="catalog-panel">Catalogue</button>
    <!-- Kiosk: the cross-project PENDING-DECISIONS panel, a separate cold
         source fetched on-demand. The badge = nb of open decisions; hidden when zero. -->
    <button id="kiosk-toggle" class="kiosk-toggle" aria-controls="kiosk-panel">Kiosk<span id="kiosk-badge" class="kiosk-badge" hidden>0</span></button>
  </header>

  <main id="kiosk" aria-label="harness kiosk"></main>

  <!-- Catalogue: the cold catalog read-model, opened on-demand from the
       topbar button. Populated by kiosk.js from catalogView(readModel). -->
  <div id="catalog-panel" class="catalog-panel" role="dialog" aria-label="catalogue des skills" hidden></div>

  <!-- Kiosk: the cross-project pending-decisions read-model, opened
       on-demand from the topbar. Populated by kiosk.js from kioskView(readModel). -->
  <div id="kiosk-panel" class="kiosk-panel" role="dialog" aria-label="décisions en attente" hidden></div>

  <script type="module" src="/assets/kiosk.js"></script>
</body>
</html>
