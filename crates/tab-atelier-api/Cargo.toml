[package]
name = "tab-atelier-api"
version = "0.5.0-dev"
edition = "2024"
license = "MPL-2.0"
description = "The HTTP API a tab-atelier server writes to: a Rocket scaffold, and the Request/Response/Resource rules, with a derived OpenAPI"
repository = "https://github.com/wdes/tab-atelier"
publish = false

# The shared rules of the shop's HTTP surface — the proxy's own best practices,
# with the proxy's business left out. Built on `tab-atelier-web` (assets,
# responses, the token gate) and on Rocket, whose routes/guards/responders it
# standardises.
#
# `rocket_okapi` pins `rocket = 0.5.1` and `schemars = 0.8`, so this is a
# lockstep: bumping one means bumping all of them. `schemars = "0.8"` is
# deliberate — the workspace lock also carries `schemars 1.2` (pulled by gpui,
# the desktop GUI), and the two majors coexist. Both crates are re-exported
# below so an app names ONE dependency (`tab-atelier-api`) and this pin lives in
# exactly one place.
[dependencies]
tab-atelier-web = { path = "../tab-atelier-web" }
rocket.workspace = true
rocket_okapi.workspace = true
schemars.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
bytes = "1"
# Gzip at the edge: a polled page is compressed per response, so this is a
# runtime cost, not a build one. Level 1 — see `cache::gzip`.
flate2 = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
# The second edge. A server that keeps its own hyper listener — the daemon
# does, because its viewer arrives as a WebSocket upgrade and its relay leaves
# as an SSE stream, and Rocket's listener hands over to neither — still answers
# with the same `Reply`, and `hyper_response` renders it. Named here rather than
# in that app for the same reason Rocket is: an app names this crate alone.
hyper = { version = "1", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "signal", "time", "macros"] }

[dev-dependencies]
# `rocket` is not repeated here: a normal dependency is already available to
# the test targets, and repeating the pin is exactly the drift this workspace
# table exists to prevent.
# One fixture needs a multi-frame body; `http_body_util::StreamBody` wants a
# stream and std has none.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
