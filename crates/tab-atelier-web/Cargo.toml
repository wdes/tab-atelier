[package]
name = "tab-atelier-web"
version = "0.5.0-dev"
edition = "2024"
license = "MPL-2.0"
description = "The web-serving layer the proxy and kiosk UIs share"
repository = "https://github.com/wdes/tab-atelier"
publish = false

# hyper + tokio only: the crate IS the HTTP server both UIs were each writing by
# hand. Everything else (the UI itself) is served from a web root, so there is
# no embedding and no asset dependency here.
[dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "signal", "time", "macros"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
