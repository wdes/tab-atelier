[package]
name = "tab-atelier-web"
version = "0.5.0-dev"
edition = "2024"
license = "MPL-2.0"
description = "The web-serving layer the proxy and kiosk UIs share"
repository = "https://github.com/wdes/tab-atelier"
publish = false

# Pure `http`/`bytes`: this crate only *builds* responses and reads files — it
# does not run a server (the servers are `tab-atelier-api`'s Rocket apps, or the
# kiosk's, and neither reaches for a transport here). An earlier draft pulled
# hyper and tokio and used neither.
[dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
serde_json = "1"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
