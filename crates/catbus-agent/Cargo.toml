[package]
name = "catbus-agent"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.92"
authors = ["William Desportes <williamdes@wdes.fr>"]
description = "Claude agent runner for tab-atelier — many tabs, many windows."
license = "MPL-2.0"
publish = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# Narrowing casts in this crate are deliberate (ms-since-epoch
# truncation for filenames, etc.); silence the noisy variants.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"

[dependencies]
# Async runtime — single-threaded suffices for one session per
# process. multi_thread would be overkill for an I/O-bound loop.
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "io-std", "fs", "sync", "time", "process", "signal"] }
# HTTPS client. reqwest with rustls keeps us off OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# Anthropic endpoints, headers and the credential schema. `default-features =
# false` drops the ureq transport: this crate is async and already has reqwest,
# and a second TLS stack would be pure weight.
claude-api = { path = "../claude-api", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive", "env"] }
# Time formatting for JSONL timestamps in the exact format Claude
# Code emits (ISO-8601 with millisecond precision and `Z` suffix).
jiff = "0.2"
# UUID generation for `uuid` / `parentUuid` fields in the
# transcript. Claude Code uses v4 UUIDs there.
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
# Line editor for the in-tab REPL: history, multi-line edit, Ctrl+C as
# a signal instead of SIGINT. Used in place of a raw stdin BufReader.
reedline = "0.42"
# CancellationToken — propagates Ctrl+C from the REPL into the agent's
# HTTP / tool loop so an in-flight request can be aborted cleanly.
tokio-util = { version = "0.7", default-features = false }
# ANSI escape removal for readers with no terminal (the transcript, the
# socket, a phone). Already in the tree as a `reedline` dependency, so this
# declares a direct use rather than adding weight — see `src/ansi.rs`.
strip-ansi-escapes = "0.2"
# Directory walking with the project's own ignore rules, so `FileTree` skips
# what the project says is not source instead of a hard-coded noise list.
# This is ripgrep's walker: the same rules `rg` applies, global ignore file
# included.
ignore = "0.4"
# Terminal width, for right-aligning the mode on the status line. Tiny and
# purpose-built — it reads TIOCGWINSZ and nothing else, and its only dependency
# (rustix, for termios) is already in the tree, so this adds one crate and no
# transitive weight.
terminal_size = "0.4"
ratatui = "0.30.2"
base64 = "0.23.1"

[dev-dependencies]
# Isolated $HOME + cwd for the end-to-end mock-API tests.
tempfile = "3"
# A real pty, for the one thing no other test can reach: the REPL. reedline
# opens /dev/tty itself, so a piped stdin fails with ENXIO — which means the
# slash-command path, including `/auto`, is otherwise untestable. `term` is the
# feature gating `pty::openpty`, a *safe* wrapper; the project denies
# `unsafe_code`, so calling libc's openpty directly is not an option. A
# dev-dependency so it never reaches a release build.
nix = { version = "0.31", features = ["term"] }
