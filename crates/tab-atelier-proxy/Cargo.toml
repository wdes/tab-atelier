[package]
name = "tab-atelier-proxy"
version = "0.5.0-dev"
edition = "2024"
license = "MPL-2.0"
description = "Multi-user Anthropic API proxy for tab-atelier fleets"
repository = "https://github.com/wdes/tab-atelier"
publish = false

[[bin]]
name = "tab-atelier-proxy"
path = "src/main.rs"

[lib]
name = "tab_atelier_proxy"
path = "src/lib.rs"

[dependencies]
# Every Anthropic endpoint, header and credential. Shared with the desktop
# crate so the two cannot drift apart again.
claude-api = { path = "../claude-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
# Blocking HTTP for the upstream hop: an LLM stream is read chunk-by-chunk and
# handed to hyper, so async buys nothing on that side and ureq keeps the
# dependency tree small. Mirrors the desktop crate's egress.
ureq = { version = "3", features = ["json"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "sync", "time", "io-util", "macros", "signal"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false }
# The HTTP layer. Routes, request guards and the streaming responder come from
# Rocket; the OpenAPI document is derived from the same structs by okapi, so the
# spec cannot drift from the handlers the way a hand-written one does.
#
# rocket_okapi pins rocket to exactly 0.5.1, so this is a three-crate lockstep:
# bumping one means bumping all of them together.
rocket = { version = "0.5.1", features = ["json"] }
# Swagger UI and RapiDoc are switched off deliberately: the spec is consumed by
# a generator, not by a browser, and the `swagger`/`rapidoc` features vendor a
# large JS bundle into the binary. The document is served as JSON at
# /openapi.json, which needs no feature at all.
rocket_okapi = { version = "0.9", default-features = false }
rocket_ws = "0.1"
# Adapter from tokio's mpsc receiver to the Stream the relay responder returns.
tokio-stream = "0.1"
# The schema derives that populate the OpenAPI document. Rocket_okapi speaks
# schemars 0.8, and the rest of the tree (via rmcp, in the desktop crate) is on
# 1.x — the two majors coexist, but a type deriving one cannot derive the other,
# so the HTTP DTOs below are deliberately their own types.
schemars = "0.8"
sha2 = { version = "0.10", default-features = false }
# Subresource Integrity, which mandates base64 — hex cannot stand in for it.
# Already in this crate's graph via ureq, so declaring it costs no compile unit.
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# Timestamp parsing for the usage log. Spelled exactly as env_logger declares
# it, so this is the same rlib the proxy already builds via env_logger's
# `humantime` feature — zero extra compile units. `default-features = false` is
# load-bearing: the defaults drag in a proc-macro and a bundled tz database,
# and nothing here needs a timezone, only UTC instants.
jiff = { version = "0.2", default-features = false, features = ["std"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

[lints.rust]
unsafe_code = "forbid"

# One .deb per binary, unlike catbus-agent (which ships inside the desktop
# packages). The proxy is a SERVER: it runs on a different machine from the
# terminal, as its own user, under its own systemd unit — installing the whole
# desktop package to get it would drag in X11 and a terminal emulator.
[package.metadata.deb]
name = "tab-atelier-proxy"
maintainer = "William Desportes <williamdes@wdes.fr>"
copyright = "2026, William Desportes <williamdes@wdes.fr>"
license-file = ["../../LICENSE", "0"]
extended-description = """\
A multi-user Anthropic API proxy for tab-atelier. Each account has its own \
key, so a fleet's machines authenticate as people rather than sharing one \
secret, and revoking one does not disturb the others. Serves a small web UI \
for account management."""
section = "utils"
priority = "optional"
# Bootstrap comes from Debian rather than a vendored copy: it is already
# packaged, it gets security updates without us re-vendoring, and duplicating
# it would put a second unreviewed copy of a large CSS file in this repo.
# postinst symlinks it into the web root. Vue is NOT in Debian, so that one is
# vendored — see assets/vendor/README.md.
#
# init-system-helpers is not implied by "$auto": it is what provides
# deb-systemd-invoke, which postinst uses so that upgrading the package
# actually restarts the service rather than leaving the old binary running.
depends = "$auto, libjs-bootstrap5, adduser, init-system-helpers"
assets = [
    ["target/release/tab-atelier-proxy", "/usr/bin/", "755"],
    ["assets/index.html", "/usr/share/tab-atelier-proxy/web/", "644"],
    ["assets/app.js", "/usr/share/tab-atelier-proxy/web/", "644"],
    ["assets/charts.js", "/usr/share/tab-atelier-proxy/web/", "644"],
    ["assets/robots.txt", "/usr/share/tab-atelier-proxy/web/", "644"],
    ["assets/vendor/vue.global.prod.js", "/usr/share/tab-atelier-proxy/web/vendor/", "644"],
    ["systemd/tab-atelier-proxy.service", "/usr/lib/systemd/system/", "644"],
    ["README.md", "/usr/share/doc/tab-atelier-proxy/", "644"],
]
maintainer-scripts = "debian/"
systemd-units = { unit-name = "tab-atelier-proxy", enable = false, start = false }
