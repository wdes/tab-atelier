name: Build Arch package

# Builds the pacman split package (tab-atelier + tab-atelier-headless) inside an
# archlinux container, because makepkg can't run on the Ubuntu .deb runner: it
# refuses to run as root and needs pacman / base-devel. The built packages are
# uploaded as an artifact; `apt-publish.yml` (the single gh-pages publisher)
# pulls the latest successful run into site/arch/, builds the pacman repo db,
# and serves it from https://deb.tab-atelier.wdes.eu/arch — same pattern as the
# Windows MSI and Android APK builds.
#
# One rolling channel: each push/tag republishes whatever this builds (capped at
# 10 by the publisher). The AUR PKGBUILD in packaging/arch/ is the versioned
# story; this hosted repo is the "track it without makepkg" convenience.

on:
    push:
        branches: [main]
        tags: ['v*']
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        name: makepkg (archlinux container)
        runs-on: ubuntu-latest
        container:
            image: archlinux:latest
        env:
            # Outside $srcdir so both survive the run — see the cache step.
            # The PKGBUILD defaults to plain `target` when these are unset, so
            # a normal `makepkg` on a user's machine is unaffected.
            CARGO_HOME: /cache/cargo
            CARGO_TARGET_DIR: /cache/target
        steps:
            # base-devel = makepkg + gcc/binutils; the rest mirror the .deb CI's
            # -dev packages (Arch bundles headers into the runtime lib package).
            - name: Install toolchain + build deps
              run: |
                  pacman -Syu --noconfirm --needed \
                      base-devel git sudo rust \
                      freetype2 fontconfig libxcb libx11 libxkbcommon \
                      libxkbcommon-x11 wayland vulkan-headers vulkan-icd-loader \
                      ttf-dejavu nftables bubblewrap

            # Full history so the nightly pkgver (git rev-list --count) is stable.
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            # This job had no cache and recompiled ~600 crates from scratch on
            # every push: 16 minutes, and since apt-publish now waits for it,
            # 16 minutes on the critical path to publishing.
            #
            # It cannot share the other jobs' cache. Those pin Rust 1.95.0 via
            # rustup; the archlinux container ships whatever pacman has (1.98.1
            # today). The compiler version is part of every Cargo fingerprint,
            # so a shared cache would restore, match nothing, rebuild
            # everything, and cost the download on top. Hence its own cache,
            # keyed by the version pacman actually installed — when Arch rolls
            # the compiler the key changes and we take one cold build.
            - name: Note the Arch Rust version
              id: rustv
              run: echo "v=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
            - name: Restore Rust build cache
              id: cache
              uses: actions/cache/restore@v4
              with:
                  # Both live outside $srcdir on purpose: $srcdir is named
                  # after $pkgver, which changes every commit, so a target dir
                  # inside it could never be found again on the next run.
                  path: |
                      /cache/cargo
                      /cache/target
                  key: arch-cargo-${{ steps.rustv.outputs.v }}-${{ hashFiles('Cargo.lock') }}
                  # Cargo.lock moves more often than the dependency graph does;
                  # an older cache still spares most of the compile.
                  restore-keys: arch-cargo-${{ steps.rustv.outputs.v }}-

            - name: Decide pkgver (arch-legal, no '~' or '-')
              id: ver
              run: |
                  # The container runs as root but the checkout is owned by a
                  # different uid, so git refuses to touch it ("dubious
                  # ownership") until we allowlist it. --global persists to
                  # root's ~/.gitconfig for the later build step too.
                  git config --global --add safe.directory '*'
                  if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
                      PV="${GITHUB_REF#refs/tags/v}"
                  else
                      BASE=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2 | sed 's/-dev$//')
                      # pacman pkgver forbids '-'; use the VCS-style .r<n>.g<sha>.
                      PV="${BASE}.r$(git rev-list --count HEAD).g$(git rev-parse --short=7 HEAD)"
                  fi
                  echo "pv=$PV" >> "$GITHUB_OUTPUT"
                  echo "→ building pacman package $PV"

            - name: Build packages (as non-root builder)
              env:
                  PV: ${{ steps.ver.outputs.pv }}
              run: |
                  set -euo pipefail
                  # makepkg refuses to run as root — build under a throwaway user.
                  useradd -m builder
                  chown -R builder:builder "$GITHUB_WORKSPACE"
                  # The cache was restored as root; makepkg writes as builder.
                  mkdir -p /cache/cargo /cache/target
                  chown -R builder:builder /cache

                  # Package THIS commit: archive the checkout into the tarball the
                  # versioned PKGBUILD expects (so we get clean package names,
                  # `tab-atelier`, not the `-git` VCS names), and point the
                  # PKGBUILD at that local file with the rolling version.
                  cd packaging/arch
                  git config --global --add safe.directory "$GITHUB_WORKSPACE"
                  git -C "$GITHUB_WORKSPACE" archive --format=tar.gz \
                      --prefix="tab-atelier-${PV}/" \
                      -o "$PWD/tab-atelier-${PV}.tar.gz" HEAD
                  sed -i "s/^pkgver=.*/pkgver=${PV}/" PKGBUILD
                  sed -i "s/^sha256sums=.*/sha256sums=('SKIP')/" PKGBUILD
                  chown -R builder:builder "$GITHUB_WORKSPACE"

                  # Deps are pre-installed above, so no -s (which would need
                  # pacman-as-builder). --noarchive keeps it fast; -f overwrites.
                  #
                  # --preserve-env is load-bearing: sudo's env_reset would drop
                  # CARGO_HOME/CARGO_TARGET_DIR, the build would quietly use
                  # $srcdir/target, and the cache would sit there doing nothing
                  # while every run still took 16 minutes.
                  sudo -u builder \
                      --preserve-env=CARGO_HOME,CARGO_TARGET_DIR \
                      makepkg -p PKGBUILD -f --noconfirm --nocheck

                  # Prove the override took, rather than trusting it: a cache
                  # that silently stopped working looks exactly like a slow CI.
                  if [ ! -x /cache/target/release/tab-atelier ]; then
                      echo "::error::CARGO_TARGET_DIR was not honoured — nothing in /cache/target"
                      exit 1
                  fi

                  ls -la ./*.pkg.tar.zst
                  mkdir -p "$GITHUB_WORKSPACE/arch-out"
                  cp ./*.pkg.tar.zst "$GITHUB_WORKSPACE/arch-out/"

            # Keep only what is expensive to rebuild — the dependency
            # artifacts. Our own crates are recompiled every push anyway (the
            # source changed, that is why the run exists), and the extracted
            # registry sources re-expand from the .crate files in seconds. An
            # unpruned target dir is several GB, and the repo-wide cache budget
            # is 10 GB shared with every other workflow: a fat cache here would
            # evict theirs and make everything slower.
            - name: Trim the cache to the dependency build
              if: always()
              run: |
                  du -sh /cache/target /cache/cargo 2>/dev/null || true
                  rm -rf /cache/target/release/incremental
                  rm -f  /cache/target/release/tab-atelier \
                         /cache/target/release/tab-atelier-headless \
                         /cache/target/release/catbus-agent
                  rm -rf /cache/target/release/deps/tab_atelier-* \
                         /cache/target/release/deps/libtab_atelier* \
                         /cache/target/release/deps/catbus_agent-* \
                         /cache/target/release/.fingerprint/tab-atelier-* \
                         /cache/target/release/.fingerprint/catbus-agent-*
                  # Re-extracted from registry/cache/*.crate on demand.
                  rm -rf /cache/cargo/registry/src
                  echo "after trim:"
                  du -sh /cache/target /cache/cargo 2>/dev/null || true
            - name: Save Rust build cache
              if: steps.cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v4
              with:
                  path: |
                      /cache/cargo
                      /cache/target
                  key: ${{ steps.cache.outputs.cache-primary-key }}

            # One multi-file artifact; apt-publish `gh run download`s it and
            # unzips the .pkg.tar.zst files into site/arch/.
            - name: Upload packages
              uses: actions/upload-artifact@v7
              with:
                  name: arch-pkgs
                  path: arch-out/*.pkg.tar.zst
                  if-no-files-found: error
                  retention-days: 30

    # Mirror of build.yml's Debian `integration` job: install the freshly
    # built packages in a CLEAN archlinux container (NOT the builder — that one
    # has every makedepend, which would mask a missing runtime `depends`) and
    # run --check-crypto. The binaries are dynamically linked against
    # libxcb/freetype/etc., so they won't even start unless `depends` is
    # complete — this is what actually validates the dependency lists. Because
    # apt-publish.yml only pulls the latest *successful run*, a smoke-test
    # failure here also gates publishing (a broken package never reaches the
    # repo). Runs on a plain runner so `docker run` is available (container
    # jobs have no docker-in-docker).
    smoke-test:
        name: Install + --check-crypto (fresh archlinux)
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: arch-pkgs
                  path: pkgs
            - name: Install packages + probe crypto
              run: |
                  # The two variants ship /usr/bin/catbus-agent and Conflict, so
                  # install + probe sequentially. `tab-atelier-[0-9]*` matches the
                  # GUI package without the `-headless`/`-debug` ones. The GUI's
                  # --check-crypto runs headless (only rustls, no gpui).
                  docker run --rm -v "$PWD/pkgs:/pkgs:ro" archlinux:latest bash -c '
                      set -e
                      pacman -Sy --noconfirm
                      pacman -U --noconfirm /pkgs/tab-atelier-headless-*.pkg.tar.zst
                      tab-atelier-headless --check-crypto
                      pacman -Rns --noconfirm tab-atelier-headless
                      pacman -U --noconfirm /pkgs/tab-atelier-[0-9]*.pkg.tar.zst
                      tab-atelier --check-crypto
                  '
