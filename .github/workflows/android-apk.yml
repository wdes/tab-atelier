name: android-apk

# Build the Android client and publish it to the website (gh-pages /android/).
#
# The app lives on this branch, not on main: it is a fork of ConnectBot, held as a
# squashed subtree in connectbot/ (it was a submodule plus a quilt-style overlay;
# see docs/connectbot-fork.md), so it is built here and only the APK is published.
# Nothing about it needs the daemon's tree.
#
# on: push to this branch, or run on demand (Actions -> android-apk -> Run
# workflow). Not `on.push.paths` — the gate is scripts/apk-needed.sh, and the
# reason is written there: path filters are evaluated against the commits in a
# push, so a tag push matches nothing and the build is silently skipped.
on:
    workflow_dispatch:
    push:
        branches: [android-app]
        # Tag pushes, as main's Android workflow had: a release tag produces an
        # APK named after the tag. apk-needed.sh always builds for a tag.
        tags: ['v*']

# The site has exactly two writers: this workflow and apt-publish.yml on main.
# Both rebuild gh-pages from a fresh clone of it, so if they overlapped,
# whichever pushed second would do so from a tree that does not contain the
# first one's change and would undo it. Serialize them instead of hoping.
concurrency:
    group: gh-pages
    cancel-in-progress: false

# peaceiris/actions-gh-pages pushes to gh-pages with this token.
permissions:
    contents: write

jobs:
    changes:
        name: Did the app change?
        runs-on: ubuntu-latest
        outputs:
            build: ${{ steps.decide.outputs.build }}
        steps:
            - uses: actions/checkout@v7
            - id: decide
              env:
                  GH_TOKEN: ${{ github.token }}
                  GITHUB_EVENT_BEFORE: ${{ github.event.before }}
              run: echo "build=$(scripts/apk-needed.sh)" >> "$GITHUB_OUTPUT"

    apk:
        name: Test, build and publish the signed release APK
        # The tests run inside this job rather than in one it depends on. When
        # they were separate, a failure left this job "skipped" — the run did
        # fail, but the job that failed produced nothing to look at, and
        # "skipped" reads like nothing happened. Here a failing suite fails the
        # job that would have published, which is what it should mean.
        # Either way nothing reaches /android/.
        needs: changes
        runs-on: ubuntu-latest
        # The signing keystore lives in this environment's secrets, so the APK
        # is signed with the real release key without it being in the repo.
        # NOTE: an environment deployment branch policy that does not allow this
        # branch would hide the secret from this job — Actions -> Environments
        # -> android-app must permit "android-app".
        environment: android-app
        if: ${{ needs.changes.outputs.build == 'true' && !contains(github.event.head_commit.message, '[skip apk]') }}
        # The runner image's SDK location, stated explicitly because the NDK
        # cache below names a path that does not exist until the NDK is
        # installed. If ANDROID_HOME resolved to nothing the cache would silently
        # save and restore the wrong directory. setup-android uses this same path
        # by default, and build-apk.sh keeps it (its own default only applies
        # when the variable is unset).
        env:
            ANDROID_HOME: /usr/local/lib/android/sdk
            ANDROID_NDK_VERSION: "26.1.10909125"
        steps:
            # connectbot/ is a plain directory of this repository — it was a
            # submodule pinned upstream, with our changes as quilt patches, and is
            # now a squashed subtree, so there is no second repository to check out.
            #
            # Full history, and this is load-bearing rather than convenient. The
            # Help screen's About section names the upstream ConnectBot commit,
            # and the only record of it is the `git-subtree-split` trailer on the
            # squash commit — which is forty-odd commits back, so the default
            # one-commit checkout cannot reach it. `build-apk.sh` then finds no
            # trailer to read, passes no `-PupstreamCommit`, and the About screen
            # says "unknown" on every APK this workflow publishes.
            #
            # It was `git -C connectbot rev-parse HEAD` while connectbot was a
            # submodule, which needed no local history at all — that is why this
            # broke when the pin became a trailer.
            #
            # Cheap: this branch is its own lineage of 45 commits, and a full
            # single-branch clone of it measured 3.0 MB.
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: '21'

            # v4, not v3: the action's default package list used to include
            # "tools", a package the SDK repository no longer publishes, so v3
            # died with "Failed to find package 'tools'" before the build began.
            # v4.0.2 fixed that upstream; asking only for what we need is still
            # quicker, and the platform and NDK come from the step below.
            - uses: android-actions/setup-android@v4
              with:
                  packages: platform-tools

            # The NDK is the slow part of this job: about 1 GB, and the runner
            # image ships 27.3.13750724, 28.2.13676358 and 29.0.14206865 but not
            # the 26.1.10909125 the overlay pins. Cache it on the version, so it
            # is fetched once and the sdkmanager call below becomes a no-op.
            # This whole step goes away with the SSH strip: compiling mosh's JNI
            # is the only reason this app needs an NDK at all.
            - name: Restore the NDK
              id: ndk-cache
              uses: actions/cache/restore@v6
              with:
                  path: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
                  key: android-ndk-${{ env.ANDROID_NDK_VERSION }}-${{ runner.os }}

            # compileSdk is 37 and its platform package is "android-37.0" — there
            # is no plain "platforms;android-37". The platform is already on the
            # runner image, so in practice only the NDK is installed here.
            - name: Install SDK platform and NDK
              run: |
                  yes | sdkmanager --licenses > /dev/null 2>&1 || true
                  sdkmanager "platforms;android-37.0" "ndk;${ANDROID_NDK_VERSION}"
                  # Breadcrumbs, not assertions: if something did not land the
                  # build says so with a real error rather than a bare test.
                  echo "platforms: $(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"
                  echo "ndk: $(ls "$ANDROID_HOME/ndk" | tr '\n' ' ')"

            - name: Save the NDK
              if: steps.ndk-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v6
              with:
                  path: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
                  key: android-ndk-${{ env.ANDROID_NDK_VERSION }}-${{ runner.os }}

            - uses: gradle/actions/setup-gradle@v6

            # oss/debug, one variant: oss is what this workflow ships and the
            # debug unit tests are the variant that needs no device. Upstream's
            # CI runs `check` across both flavors, which would double the runtime
            # to lint code that never reaches a user.
            #
            # Tests that need a live tab-atelier daemon skip themselves: CI has
            # none, and a test that only passes on one machine is worse than no
            # test.
            - name: Unit tests
              run: |
                  cd connectbot
                  ./gradlew --no-daemon :app:testOssDebugUnitTest

            - name: Upload the test report
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: unit-test-report
                  path: |
                      connectbot/app/build/reports/tests/
                      connectbot/app/build/test-results/

            # Both secrets come from the android-app environment, the same one
            # main's Android workflow uses. Both are required and neither has a
            # fallback: the keystore is not in this repository (it is public) and
            # neither is its password. Fail here, naming what is missing, rather
            # than letting Gradle fail later with something less obvious.
            - name: Check the signing secrets
              env:
                  KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                  KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
              run: |
                  missing=0
                  if [ -z "$KEYSTORE_B64" ]; then
                      echo "::error::ANDROID_KEYSTORE_BASE64 is not set in the 'android-app' environment"
                      missing=1
                  fi
                  if [ -z "$KEYSTORE_PASSWORD" ]; then
                      echo "::error::ANDROID_KEYSTORE_PASSWORD is not set in the 'android-app' environment"
                      missing=1
                  fi
                  exit $missing

            - name: Compute the version
              run: |
                  # A tag build takes its name from the tag, as main's Android
                  # workflow did; otherwise 0.6.<run>, which is enough to tell
                  # builds apart without a release process.
                  if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
                      name="${GITHUB_REF#refs/tags/v}"
                  else
                      name="0.6.${GITHUB_RUN_NUMBER}"
                  fi
                  sha="${GITHUB_SHA::8}"
                  # versionCode must only ever climb. The app already installed
                  # on a device is 16777472 and Android refuses an upgrade that
                  # does not increase it, so it is the run number plus that
                  # floor, never the version name.
                  code=$((16777472 + GITHUB_RUN_NUMBER))
                  # The build time is in the filename because publish-apk.sh
                  # orders APKs by name: a fresh clone stamps every file with
                  # the checkout time, so mtime cannot be trusted.
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  apk="tab-atelier-remote_${stamp}_${sha}_${name}.apk"
                  {
                      echo "NAME=$name"
                      echo "CODE=$code"
                      echo "SHA=$sha"
                      echo "APK_NAME=$apk"
                  } >> "$GITHUB_ENV"
                  echo "building ${GITHUB_REF_NAME} as $name (code $code) -> $apk"

            - name: Build the signed release APK
              # build-apk.sh decodes ANDROID_KEYSTORE_BASE64 into a temporary
              # file outside the checkout and reads the password from the same
              # variable names, so nothing lands in the working tree.
              # ANDROID_KEYSTORE_ALIAS is optional; build-apk.sh defaults to
              # "ta-remote".
              # APP_BUILD_COMMIT is the short SHA compute-version already put in
              # SHA (8 characters). It becomes BuildConfig.BUILD_COMMIT, which
              # the Help screen's About section shows next to the version, so an
              # installed APK names the commit it was built from.
              env:
                  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
                  APP_BUILD_COMMIT: ${{ env.SHA }}
              run: |
                  APP_VERSION_CODE="$CODE" APP_VERSION_NAME="$NAME" scripts/build-apk.sh
                  src=connectbot/app/build/outputs/apk/oss/release/app-oss-release.apk
                  test -s "$src"
                  # upload-artifact with archive:false takes the artifact name
                  # from the FILE and ignores `name:` (its README says so, and a
                  # run confirmed it: the artifact came out as app-oss-release.apk).
                  # So the file itself is given the name it will have on the site.
                  cp "$src" "$APK_NAME"
                  echo "built $APK_NAME ($(du -h "$APK_NAME" | cut -f1))"

            # Guards the app's identity before anything is published. An APK
            # signed with the wrong key cannot upgrade an installed copy, and
            # Google's ownership registration is tied to this certificate, so a
            # rotated or misplaced keystore must fail here rather than reach a
            # device. The fingerprint is the one NOTICE and the README record.
            - name: Verify the signing certificate
              env:
                  EXPECTED: d8ee6b25599f1d73125ff6cd1d555815d864ca33b86c22642e0ba6bdaa5220ca
              run: |
                  # apksigner is not on PATH: it ships inside build-tools. Nor
                  # is there another way to read the certificate — minSdk 24
                  # means the APK is signed with the v2/v3 scheme only, so
                  # keytool -printcert -jarfile reports an unsigned JAR and
                  # jarsigner has no v1 signature to read. apksigner is the only
                  # reader, so it has to be found rather than assumed.
                  #
                  # Two runs were lost to this step, both from guessing. It now
                  # tries every build-tools copy, newest first; matches the
                  # digest loosely (a fixed label silently produced an empty
                  # reading on the runner while matching locally); and when
                  # nothing matches it prints what it saw, so the failure
                  # explains itself instead of blaming the keystore. That last
                  # part matters: a check that cannot read a certificate and a
                  # check that finds the wrong one are different problems, and
                  # the first version reported both as "wrong keystore".
                  echo "build-tools present: $(ls "$ANDROID_HOME/build-tools" 2>&1 | tr '\n' ' ')"
                  got=""
                  for candidate in $(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | sort -Vr); do
                      out="$("$candidate" verify --print-certs "$APK_NAME" 2>&1 || true)"
                      # tr first, because the digest is printed colon-separated;
                      # then the SHA-256 line only, so the SHA-1 and MD5 digests
                      # on the lines below it cannot be picked up by mistake.
                      dig="$(printf '%s\n' "$out" | tr -d ':\r' | tr 'A-Z' 'a-z' \
                          | grep -iE 'sha-?256' | grep -oE '[0-9a-f]{64}' | head -1)"
                      if [ -n "$dig" ]; then
                          got="$dig"
                          echo "certificate read with $candidate"
                          break
                      fi
                      echo "--- $candidate yielded no digest; its output was:"
                      printf '%s\n' "$out" | head -8
                  done
                  if [ -z "$got" ]; then
                      echo "::error::no signing certificate could be read from $APK_NAME"
                      exit 1
                  fi
                  if [ "$got" != "$EXPECTED" ]; then
                      echo "::error::signed by $got, expected $EXPECTED — wrong keystore"
                      exit 1
                  fi
                  echo "signed by the expected certificate: $got"

            # Kept as a raw file (not zipped) so the bytes are directly
            # downloadable from the run, like the other artifacts here. No
            # `name:` — with archive:false it is ignored, and the artifact takes
            # the file's name, which is the name it will have on the site.
            - name: Upload the APK artifact
              uses: actions/upload-artifact@v7
              with:
                  path: ${{ env.APK_NAME }}
                  archive: false
                  if-no-files-found: error

            - name: Stage the site
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PUBLISH_APK_NAME: ${{ env.APK_NAME }}
              run: |
                  scripts/publish-apk.sh \
                      connectbot/app/build/outputs/apk/oss/release/app-oss-release.apk \
                      "$NAME" "$SHA"

            # Same action, and the same author, as apt-publish.yml uses for the
            # deb/Arch/Windows sections. force_orphan keeps gh-pages history from
            # growing by ~13 MB per build; publish-apk.sh fetched the existing
            # tree first, so the other sections are republished unchanged.
            - name: Publish to gh-pages
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./.publish-site
                  publish_branch: gh-pages
                  user_name: 'Wdes Bot'
                  user_email: 'williamdes+wdes-bot@wdes.fr'
                  commit_message: 'Publish Android app ${{ env.NAME }} (${{ env.SHA }})'
                  keep_files: false
                  force_orphan: true
