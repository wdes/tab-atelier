openapi: 3.1.0
info:
  title: tab-atelier local API
  # The `version` line is rewritten to the running build's version when
  # served from `GET /openapi.yaml`; the shipped file carries 0.0.0.
  version: 0.0.0
  description: >
    Local HTTP API of tab-atelier / tab-atelier-headless. Exposes the tab
    list, scrollback, input, agent state, share-link management and token
    rotation. Served on the loopback/LAN bind addresses configured in
    preferences (`api_addr`, `api_tls_addr`).
  license:
    name: MPL-2.0
    url: https://mozilla.org/MPL/2.0/
servers:
  - url: http://127.0.0.1:7890
    description: HTTP listener (default api_addr)
  - url: https://127.0.0.1:7891
    description: TLS listener (self-signed by default; api_tls_addr)
security:
  - bearerAuth: []
  - shareToken: []
tags:
  - name: tabs
    description: Tab list, I/O and per-tab state
  - name: tokens
    description: Master token + share-link token management
  - name: logs
    description: Recent daemon log records (loopback callers only)
  - name: admin
    description: Process-level administration (hot-swap upgrade)
paths:
  /claims:
    get:
      tags: [claims]
      summary: List live leases
      description: >
        Every lease currently held on this host, with the wall-clock instant
        each expires. Lapsed entries are never returned, so a caller does not
        have to filter by time itself.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Live leases
          content:
            application/json:
              schema:
                type: object
                properties:
                  claims:
                    type: array
                    items: { $ref: "#/components/schemas/Claim" }
                  now_ms:
                    type: integer
                    format: int64
                    description: The daemon's clock, so a client can compute remaining time without trusting its own.
    post:
      tags: [claims]
      summary: Take or renew a lease
      description: >
        Mutual exclusion over a named key — the primitive that keeps two agents
        off the same task. Granted when the key is free, its lease has lapsed,
        or the same holder is renewing (idempotent, so an agent can refresh on
        a timer without tracking ownership).


        Answers **409 with the current holder** when someone else has it, so a
        refused agent can choose different work instead of spinning.


        It is a lease, not a lock: it expires. Agent tabs die constantly, and a
        lock without expiry in a fleet of ephemeral holders is a deadlock
        generator. Every grant carries a strictly increasing `fence`, so a
        stalled holder that comes back can be told apart from the live one.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, holder]
              properties:
                key: { type: string, maxLength: 200, example: "task:cov:src/api.rs" }
                holder: { type: string, maxLength: 100, example: "tab-7f3a" }
                ttl_ms:
                  type: integer
                  format: int64
                  default: 300000
                  description: Clamped to [1s, 6h].
      responses:
        "200":
          description: Granted (or renewed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  granted: { type: boolean, enum: [true] }
                  claim: { $ref: "#/components/schemas/Claim" }
                  now_ms: { type: integer, format: int64 }
        "409":
          description: Held by someone else — the body names them
          content:
            application/json:
              schema:
                type: object
                properties:
                  granted: { type: boolean, enum: [false] }
                  claim: { $ref: "#/components/schemas/Claim" }
        "400": { description: Missing/invalid key or holder }
  /claims/release:
    post:
      tags: [claims]
      summary: Give a lease back early
      description: >
        Only the holder may release; a lapsed holder cannot release the key out
        from under whoever took it next. Releasing something you no longer hold
        answers 200 with `released:false` rather than an error — that is what a
        late agent does, and it should be a no-op, not a failure.


        A POST rather than `DELETE /claims/{key}` because keys contain slashes
        (they are task ids and file paths).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, holder]
              properties:
                key: { type: string }
                holder: { type: string }
      responses:
        "200":
          description: Whether a lease was actually removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  released: { type: boolean }
        "400": { description: Missing key or holder }
  /fleet:
    get:
      tags: [fleet]
      summary: The fleet as a graph — who is working on what, and where
      description: >
        A join of three things that each know part of the answer: the
        blackboard (what work exists, who was awarded it), the lease registry
        (what is actually held right now) and the tab list (which agents are
        alive here), plus the learned federation directory.


        `works_on` edges carry `leased` and `expires_in_ms`. An award with no
        live lease is the interesting state — the agent said it was working and
        then stopped holding the work, having died or thought past its expiry —
        so it is a field rather than something a renderer has to infer.


        Agents with no tab on this host appear with `status: elsewhere`: in a
        federated fleet most agents are on another machine, and omitting them
        would render work assigned to nobody.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Nodes and edges
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items: { $ref: "#/components/schemas/FleetNode" }
                  edges:
                    type: array
                    items: { $ref: "#/components/schemas/FleetEdge" }
  /blackboard:
    get:
      tags: [blackboard]
      summary: Read blackboard entries
      description: >
        The shared append-only log every tab reads, and the medium the
        contract-net verbs (announce/bid/award/done) travel on.


        Reachable by remote peers as well as local callers, because gossip is
        an exchange between daemons: the log is a grow-only set, so a peer can
        add entries but can never remove, rewrite or reorder ours.
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
          description: >
            Position in this host's file to resume from. A position, not a
            logical clock — the merge is a set union and does not need one.
      responses:
        "200":
          description: Entries, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/BlackboardEntry" }
                  next:
                    type: integer
                    description: Pass as `since` next time.
                  origin:
                    type: string
                    description: Which host answered.
    post:
      tags: [blackboard]
      summary: Merge a peer's entries
      description: >
        Union by entry id — idempotent, commutative and associative. Two hosts
        that exchange batches in any order, any number of times, converge on
        the same board without agreeing on anything first (Shapiro et al.,
        CRDTs, 2011). Entries without an id cannot be de-duplicated and are
        dropped rather than accumulating a copy per exchange.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  maxItems: 5000
                  items: { $ref: "#/components/schemas/BlackboardEntry" }
      responses:
        "200":
          description: How many entries were new
          content:
            application/json:
              schema:
                type: object
                properties:
                  merged: { type: integer }
                  received: { type: integer }
        "400": { description: "Body is not an object with an `entries` array" }
        "413": { description: Batch larger than 5000 entries }
  /logs:
    get:
      tags: [logs]
      summary: Tail the running daemon's log ring
      description: >
        The last N records the daemon logged (INFO and above, whatever the
        console filter is), for diagnosing a running instance without journald
        access or a pre-configured file sink. Bounded and lossy — a live tail,
        not an audit log.


        **Loopback only.** Refused with 403 unless the peer address is
        127.0.0.1/::1, because the API binds 0.0.0.0 by default and the records
        carry tab names, working directories and error strings. The peer
        address is the gate; `X-Forwarded-For` is not consulted.
      security:
        - bearerAuth: []
      parameters:
        - name: lines
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 200 }
          description: How many of the most recent lines to return (capped at the ring size).
      responses:
        "200":
          description: Recent log lines, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        ts_ms: { type: integer, format: int64, description: "Unix milliseconds" }
                        level: { type: string, example: INFO }
                        target: { type: string, example: tab_atelier::headless }
                        msg: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Caller is not on the loopback interface }
  /tabs:
    get:
      tags: [tabs]
      summary: List tabs
      description: cwd, name, output preview, agent state, viewers, watts/cpu/uptime.
      responses:
        "200":
          description: Tab list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tabs:
                    type: array
                    items: { $ref: "#/components/schemas/Tab" }
                  active: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [tabs]
      summary: Create a tab
      responses:
        "200":
          description: Creation queued
          content:
            application/json:
              schema:
                type: object
                properties: { queued: { type: string, example: new } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/{idx}/output:
    get:
      tags: [tabs]
      summary: Tab scrollback
      parameters:
        - $ref: "#/components/parameters/idx"
        - name: since
          in: query
          schema: { type: integer }
          description: Return only bytes after this offset (delta patching).
        - name: crc
          in: query
          schema: { type: string }
      responses:
        "200": { description: Scrollback text, content: { text/plain: {} } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/{idx}/input:
    post:
      tags: [tabs]
      summary: Send raw bytes to the tab's PTY
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "200": { description: Queued }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "423": { description: Tab is locked }
  /tabs/{idx}/activate:
    post:
      tags: [tabs]
      summary: Switch to a tab
      parameters: [ { $ref: "#/components/parameters/idx" } ]
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/{idx}/rename:
    post:
      tags: [tabs]
      summary: Rename a tab
      parameters: [ { $ref: "#/components/parameters/idx" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string } } }
      responses:
        "200": { description: Renamed }
        "400": { description: Empty name }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/{idx}:
    delete:
      tags: [tabs]
      summary: Close a tab
      parameters: [ { $ref: "#/components/parameters/idx" } ]
      responses:
        "200": { description: Closed }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/by-id/{id}/status:
    post:
      tags: [tabs]
      summary: Publish agent state (drives the desktop LED)
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                state: { type: string, enum: [thinking, waiting, error, idle] }
                label: { type: string }
                sessionId: { type: string }
                agentKind: { type: string }
                planMode: { type: boolean }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/by-id/{id}/context:
    post:
      tags: [tabs]
      summary: Set/clear the tab context label (PR/task)
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { context: { type: [string, "null"], maxLength: 2000 } }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/by-id/{id}/bg-color:
    post:
      tags: [tabs]
      summary: Set/clear the per-tab background colour
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { color: { type: [string, "null"], example: "#002451" } }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/by-id/{id}/schedule:
    post:
      tags: [tabs]
      summary: Off-hours auto-lock (OSM opening_hours rule + IANA tz)
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rule: { type: [string, "null"], example: "Mo-Fr 09:00-18:00" }
                tz: { type: string, example: "Europe/Paris" }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/by-id/{id}/net:
    post:
      tags: [tabs]
      summary: Turn the tab's internet off/on (bubblewrap netns jail)
      description: >
        Cut or restore a tab's network. `disabled:true` respawns the tab's
        shell inside a bubblewrap network namespace (loopback only);
        `disabled:false` respawns it without the jail. Omitting the body
        toggles. The shell restarts to apply, so the change is not
        instantaneous. Turning net off when bubblewrap (`bwrap`) isn't
        installed on the host is refused with 412.
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { disabled: { type: boolean } }
      responses:
        "200":
          description: New state
          content:
            application/json:
              schema:
                type: object
                properties: { net_disabled: { type: boolean } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Tab not found }
        "412": { description: bubblewrap (bwrap) is not installed }
  /tabs/by-id/{id}/net-allow:
    post:
      tags: [tabs]
      summary: Restrict a tab to an allowlist (filtering proxy)
      description: >
        Put the tab into allowlist mode — it may reach only the listed
        presets / domains / CIDRs, enforced by a per-tab filtering CONNECT
        proxy injected via `HTTPS_PROXY` (and, on the privileged headless
        service, nftables). A non-empty config also clears net-off (mutually
        exclusive). An empty/absent body clears allowlist mode (tab returns
        to unrestricted). The shell respawns to apply. Presets today:
        `claude-code`, `cloudflare`.
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                presets: { type: array, items: { type: string, enum: [claude-code, cloudflare] } }
                domains: { type: array, items: { type: string }, example: ["api.anthropic.com", "*.example.com"] }
                cidrs: { type: array, items: { type: string }, example: ["104.16.0.0/13"] }
      responses:
        "200":
          description: New state
          content:
            application/json:
              schema:
                type: object
                properties: { allowlist_active: { type: boolean } }
        "400": { description: Unknown preset or invalid CIDR }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Tab not found }
  /tabs/by-id/{id}/ssh-agent:
    post:
      tags: [tabs]
      summary: Give the tab its own ssh-agent
      description: >
        Enable or disable a per-tab `ssh-agent` so the tab holds a distinct
        SSH identity (or none) from other tabs. `enabled:true` respawns the
        shell with a dedicated `SSH_AUTH_SOCK`; an optional `key` path is
        auto-loaded with `ssh-add` (must be passphrase-less — encrypted keys
        are the user's job to `ssh-add` inside the tab). `enabled:false`
        respawns without the socket and reaps the agent. The shell restarts to
        apply, so the change is not instantaneous. Headless-daemon only — the
        desktop GUI refuses with 501. Under the hardened systemd unit a `key`
        path must be visible inside the daemon's mount namespace (e.g. under
        `/var/lib/tab-atelier`).
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean, default: true }
                key: { type: string, nullable: true, example: "/var/lib/tab-atelier/id_ed25519" }
      responses:
        "200":
          description: New state
          content:
            application/json:
              schema:
                type: object
                properties: { ssh_agent: { type: boolean } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Tab not found }
        "501": { description: Not supported on the desktop GUI (headless daemon only) }
  /tabs/by-id/{id}/view:
    get:
      tags: [tabs]
      summary: HTML share-link viewer (xterm.js)
      description: >
        Browser-facing terminal viewer. Authenticate with `?token=<share or
        master token>` (add `&ro=1` for a read-only link). A revoked or
        invalid token returns a 401 — an HTML page for browsers, JSON
        otherwise (content-negotiated on `Accept`).
      parameters:
        - $ref: "#/components/parameters/id"
        - name: token
          in: query
          schema: { type: string }
        - name: ro
          in: query
          schema: { type: integer, enum: [1] }
      responses:
        "200": { description: HTML viewer, content: { text/html: {} } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/rotate-tokens:
    post:
      tags: [tokens]
      summary: Revoke all per-tab share tokens
      description: >
        Clears every tab's share_token_rw/ro — all outstanding share links
        401 immediately; a fresh token is minted on the next share. The
        master API token is untouched. Master token only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { type: object, properties: { revoked: { type: integer } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /master-token/reset:
    post:
      tags: [tokens]
      summary: Hot-swap the master API token
      description: >
        Generates a fresh master token, persists it to api.token, and
        publishes it live — every client/link carrying the OLD master token
        401s on its next request, no daemon restart. Master token only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: New token
          content:
            application/json:
              schema: { type: object, properties: { token: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { description: Could not persist token }
  /upgrade:
    post:
      tags: [admin]
      summary: Hot-swap onto the newly installed binary (tabs stay live)
      description: >
        Re-exec the running process onto the binary currently installed at
        its own path, handing every tab's live PTY across the exec — the
        shells, and whatever runs inside them, are never restarted. Install
        the new binary first (apt upgrade / copy over the file), then call
        this. The swap happens moments after the response flushes; expect
        the API to drop briefly while the new binary boots and re-binds.
        Unix only; master token only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Swap armed
          content:
            application/json:
              schema:
                type: object
                properties:
                  upgrading: { type: boolean }
                  pid: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: No binary found at the re-exec path }
        "501": { description: Platform without exec-based handoff (Windows) }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Master API token (`tab-atelier token`) or, on /tabs/by-id/*, a per-tab share token.
    shareToken:
      type: apiKey
      in: query
      name: token
      description: Per-tab share token (or master token) as a query parameter — used by share links.
  parameters:
    idx:
      name: idx
      in: path
      required: true
      schema: { type: integer }
      description: Tab index. Most by-index routes also accept the UUID form under /tabs/by-id/{id}/…
    id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Stable per-tab UUID.
  responses:
    Unauthorized:
      description: Invalid or missing token. HTML page for browsers (Accept text/html), JSON otherwise.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Share token is read-only.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties: { error: { type: string } }
    Claim:
      type: object
      description: One lease over a named key.
      properties:
        key: { type: string, example: "task:cov:src/api.rs" }
        holder:
          type: string
          description: Opaque identity — by convention a tab name or uuid.
          example: "tab-7f3a"
        granted_ms: { type: integer, format: int64 }
        expires_ms: { type: integer, format: int64 }
        fence:
          type: integer
          format: int64
          description: >
            Strictly increasing across every grant this host makes, including
            renewals. A holder presenting an older fence is presenting a claim
            it has already lost.
    FleetNode:
      type: object
      properties:
        id:
          type: string
          description: "Unique in the graph: `host:<name>`, `agent:<name>`, `task:<id>`."
          example: "task:cov:src/api.rs"
        kind: { type: string, enum: [host, agent, task] }
        label: { type: string, description: What to draw on it. }
        status:
          type: string
          description: >
            Task lifecycle (open/bidding/awarded/done/failed), an agent's
            reported state, `elsewhere` for an agent with no tab here, or
            self/peer on a host.
        uuid:
          type: string
          description: For agents, the tab uuid, so a viewer can link to the tab.
    FleetEdge:
      type: object
      properties:
        from: { type: string }
        to: { type: string }
        kind:
          type: string
          enum: [runs_on, announced, bid, works_on, home, peer]
        label: { type: string, description: A bid's cost, where applicable. }
        leased:
          type: boolean
          description: >
            On `works_on`: whether a live lease still backs the award. False
            means the agent stopped holding the work.
        expires_in_ms:
          type: integer
          format: int64
          description: "On `works_on`: milliseconds until the lease lapses."
    BlackboardEntry:
      type: object
      description: >
        One shared-log entry. Plain broadcasts (`kind: note`) and contract-net
        messages share the shape, so the protocol needs no separate transport.
      required: [ts, msg]
      properties:
        ts: { type: integer, format: int64, description: Unix seconds. }
        msg: { type: string }
        id:
          type: string
          description: >
            Stable identity, unique across hosts — this is what makes the log a
            grow-only set. Absent on entries written before typed notes
            existed; readers backfill those from a content hash.
        origin: { type: string, description: Host that wrote it. }
        from: { type: string, description: Agent that wrote it. }
        topic: { type: string, description: Channel, for filtering plain notes. }
        kind:
          type: string
          enum: [note, announce, bid, award, done]
          default: note
        task: { type: string, description: Task this entry concerns. }
        cost:
          type: integer
          format: int64
          description: A bid's asking price, lower wins. Integer so a NaN can't make the winner depend on comparison order.
        to: { type: string, description: An award's winner. }
        ok: { type: boolean, description: Whether a `done` reports success. }
    Tab:
      type: object
      properties:
        id: { type: string, format: uuid }
        index: { type: integer }
        name: { type: string }
        cwd: { type: [string, "null"] }
        active: { type: boolean }
        locked: { type: boolean }
        lock_reason: { type: [string, "null"], enum: [manual, schedule, null] }
        agent_state: { type: [string, "null"], enum: [thinking, waiting, error, null] }
        agent_kind: { type: [string, "null"] }
        led: { type: [string, "null"], enum: [dead, error, working, unreviewed, idle, null], description: "Fully-derived per-tab agent LED matching the desktop tab-strip dot; omitted when no dot should show" }
        last_used_at: { type: [integer, "null"], description: "Unix-millis of the last time this tab was used (input / activate / viewer open). Clients sort by this descending for a most-recently-used list. Omitted for never-used tabs" }
        context: { type: [string, "null"] }
        viewers: { type: integer, description: WS viewers currently watching this tab }
        output_crc: { type: integer, description: "CRC-32 of the tab's current output — same value /output returns as X-Output-Crc. Poll this to learn which tabs moved in one request, and fetch /output only where it differs" }
        output_len: { type: integer, description: "Byte length behind output_crc; pairs with it for the conditional /output?since=&crc= form" }
        watts: { type: [number, "null"] }
