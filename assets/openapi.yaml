openapi: 3.1.0
info:
  title: tab-atelier local API
  # The `version` line is rewritten to the running build's version when
  # served from `GET /openapi.yaml`; the shipped file carries 0.0.0.
  version: 0.0.0
  description: >
    Local HTTP API of tab-atelier / tab-atelier-headless. Exposes the tab
    list, scrollback, input, agent state, share-link management and token
    rotation. Served on the loopback/LAN bind addresses configured in
    preferences (`api_addr`, `api_tls_addr`).
  license:
    name: MPL-2.0
    url: https://mozilla.org/MPL/2.0/
servers:
  - url: http://127.0.0.1:7890
    description: HTTP listener (default api_addr)
  - url: https://127.0.0.1:7891
    description: TLS listener (self-signed by default; api_tls_addr)
security:
  - bearerAuth: []
  - shareToken: []
tags:
  - name: tabs
    description: Tab list, I/O and per-tab state
  - name: tokens
    description: Master token + share-link token management
  - name: dashboard
    description: Aggregated fleet view, activity, and read-only share token
paths:
  /dashboard:
    get:
      tags: [dashboard]
      summary: Dashboard app page (HTML)
      description: >
        The harness dashboard single-page app. Behind the auth gate (master or the
        dashboard read-only share token); its static assets `/assets/dashboard.js`
        and `/assets/dashboard.css` are served publicly.
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /dashboard/state:
    get:
      tags: [dashboard]
      summary: Aggregated, phase-grouped fleet view
      description: >
        Every tab mapped onto the 7 phase nodes via its `assignment`, grouped under
        projects and repo-family services, with delegation lineage and the
        self-declared agent card. Authorises with the master OR the read-only
        dashboard share token.
      responses:
        "200":
          description: Fleet aggregation
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes: { type: array, items: { type: object } }
                  unmapped: { type: array, items: { type: object } }
                  projects: { type: array, items: { type: object } }
                  services: { type: array, items: { type: object } }
                  lineage: { type: array, items: { type: object } }
                  unassigned: { type: array, items: { type: object } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /dashboard/activity:
    get:
      tags: [dashboard]
      summary: Fleet activity passthrough
      description: >
        Verbatim passthrough of the activity scribe's `activity.json`; a graceful
        empty object `{}` when absent or malformed (never a 404/500). Authorises
        with the master OR the read-only dashboard share token.
      responses:
        "200": { description: Activity JSON, content: { application/json: {} } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /dashboard/share-token:
    get:
      tags: [dashboard]
      summary: Mint/return the read-only dashboard share token
      description: >
        Returns the global read-only dashboard share token, minting it on first
        use. MASTER ONLY — the dashboard share token itself never authorises this
        route.
      responses:
        "200":
          description: The share token
          content:
            application/json:
              schema:
                type: object
                properties: { token: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs:
    get:
      tags: [tabs]
      summary: List tabs
      description: cwd, name, output preview, agent state, viewers, watts/cpu/uptime.
      responses:
        "200":
          description: Tab list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tabs:
                    type: array
                    items: { $ref: "#/components/schemas/Tab" }
                  active: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [tabs]
      summary: Create a tab
      responses:
        "200":
          description: Creation queued
          content:
            application/json:
              schema:
                type: object
                properties: { queued: { type: string, example: new } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/{idx}/output:
    get:
      tags: [tabs]
      summary: Tab scrollback
      parameters:
        - $ref: "#/components/parameters/idx"
        - name: since
          in: query
          schema: { type: integer }
          description: Return only bytes after this offset (delta patching).
        - name: crc
          in: query
          schema: { type: string }
      responses:
        "200": { description: Scrollback text, content: { text/plain: {} } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/{idx}/input:
    post:
      tags: [tabs]
      summary: Send raw bytes to the tab's PTY
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "200": { description: Queued }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "423": { description: Tab is locked }
  /tabs/{idx}/activate:
    post:
      tags: [tabs]
      summary: Switch to a tab
      parameters: [ { $ref: "#/components/parameters/idx" } ]
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/{idx}/rename:
    post:
      tags: [tabs]
      summary: Rename a tab
      parameters: [ { $ref: "#/components/parameters/idx" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string } } }
      responses:
        "200": { description: Renamed }
        "400": { description: Empty name }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/{idx}:
    delete:
      tags: [tabs]
      summary: Close a tab
      parameters: [ { $ref: "#/components/parameters/idx" } ]
      responses:
        "200": { description: Closed }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/by-id/{id}/status:
    post:
      tags: [tabs]
      summary: Publish agent state (drives the desktop LED)
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                state: { type: string, enum: [thinking, waiting, error, idle] }
                label: { type: string }
                sessionId: { type: string }
                agentKind: { type: string }
                planMode: { type: boolean }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/by-id/{id}/context:
    post:
      tags: [tabs]
      summary: Set/clear the tab context label (PR/task)
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { context: { type: [string, "null"], maxLength: 2000 } }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/by-id/{id}/assignment:
    post:
      tags: [tabs]
      summary: Set/clear the stable workflow assignment (persisted, hook-immune)
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { assignment: { type: [string, "null"], maxLength: 2000, example: "build/implementer" } }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/by-id/{id}/parent:
    post:
      tags: [tabs]
      summary: Stamp/clear a spawned tab's lineage (parent_tab_id)
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { parent_tab_id: { type: [string, "null"], maxLength: 128 } }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/by-id/{id}/rehome:
    post:
      tags: [tabs]
      summary: Set/clear a predecessor tab's re-home progress
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rehome_status:
                  type: [string, "null"]
                  enum: [handoff-written, successor-ready, ack-sent, safe-to-close, null]
      responses:
        "200": { description: OK }
        "400": { description: invalid rehome_status }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/by-id/{id}/specialty:
    post:
      tags: [tabs]
      summary: Set/clear the agent-card specialty (persisted, hook-immune)
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { specialty: { type: [string, "null"], maxLength: 2000 } }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/by-id/{id}/orchestrator:
    post:
      tags: [tabs]
      summary: Set/clear the orchestrator this agent serves (a tab UUID or "free")
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { orchestrator: { type: [string, "null"], maxLength: 2000 } }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/by-id/{id}/objective:
    post:
      tags: [tabs]
      summary: Set/clear the agent-card objective (persisted, hook-immune)
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { objective: { type: [string, "null"], maxLength: 2000 } }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/by-id/{id}/current-task:
    post:
      tags: [tabs]
      summary: APPEND one phrase to the bounded current-task permalog
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { current_task: { type: string, maxLength: 2000 } }
      responses:
        "200": { description: OK (empty phrase is a no-op) }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/by-id/{id}/rounds-active:
    post:
      tags: [tabs]
      summary: Toggle supervision-rounds status (server stamps lastRoundAt when active)
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { rounds_active: { type: [string, "null"], example: "true" } }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/by-id/{id}/conventions:
    post:
      tags: [tabs]
      summary: Overwrite the declared .md conventions (comma-separated)
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { conventions: { type: [string, "null"], example: "AGENTS.md,CLAUDE.md" } }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/by-id/{id}/evaluation:
    post:
      tags: [tabs]
      summary: APPEND one evaluation record to the bounded ring
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evaluator, at, tokens, scores, verdict]
              properties:
                evaluator: { type: string }
                at: { type: integer, format: int64 }
                taskRef: { type: string }
                tokens:
                  type: object
                  properties: { input: { type: integer }, out: { type: integer } }
                scores:
                  type: object
                  properties: { relevance: { type: integer }, errors: { type: integer }, omissions: { type: integer } }
                verdict: { type: string }
                note: { type: string }
      responses:
        "200": { description: OK }
        "400": { description: invalid evaluation record }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/by-id/{id}/bump-usage:
    post:
      tags: [tabs]
      summary: Bump the tab's usage counter + stamp last-used
      parameters: [ { $ref: "#/components/parameters/id" } ]
      responses:
        "200": { description: OK, returns the new usageCount }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/by-id/{id}/bg-color:
    post:
      tags: [tabs]
      summary: Set/clear the per-tab background colour
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { color: { type: [string, "null"], example: "#002451" } }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/by-id/{id}/schedule:
    post:
      tags: [tabs]
      summary: Off-hours auto-lock (OSM opening_hours rule + IANA tz)
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rule: { type: [string, "null"], example: "Mo-Fr 09:00-18:00" }
                tz: { type: string, example: "Europe/Paris" }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/by-id/{id}/net:
    post:
      tags: [tabs]
      summary: Turn the tab's internet off/on (bubblewrap netns jail)
      description: >
        Cut or restore a tab's network. `disabled:true` respawns the tab's
        shell inside a bubblewrap network namespace (loopback only);
        `disabled:false` respawns it without the jail. Omitting the body
        toggles. The shell restarts to apply, so the change is not
        instantaneous. Turning net off when bubblewrap (`bwrap`) isn't
        installed on the host is refused with 412.
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { disabled: { type: boolean } }
      responses:
        "200":
          description: New state
          content:
            application/json:
              schema:
                type: object
                properties: { net_disabled: { type: boolean } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Tab not found }
        "412": { description: bubblewrap (bwrap) is not installed }
  /tabs/by-id/{id}/net-allow:
    post:
      tags: [tabs]
      summary: Restrict a tab to an allowlist (filtering proxy)
      description: >
        Put the tab into allowlist mode — it may reach only the listed
        presets / domains / CIDRs, enforced by a per-tab filtering CONNECT
        proxy injected via `HTTPS_PROXY` (and, on the privileged headless
        service, nftables). A non-empty config also clears net-off (mutually
        exclusive). An empty/absent body clears allowlist mode (tab returns
        to unrestricted). The shell respawns to apply. Presets today:
        `claude-code`, `cloudflare`.
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                presets: { type: array, items: { type: string, enum: [claude-code, cloudflare] } }
                domains: { type: array, items: { type: string }, example: ["api.anthropic.com", "*.example.com"] }
                cidrs: { type: array, items: { type: string }, example: ["104.16.0.0/13"] }
      responses:
        "200":
          description: New state
          content:
            application/json:
              schema:
                type: object
                properties: { allowlist_active: { type: boolean } }
        "400": { description: Unknown preset or invalid CIDR }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Tab not found }
  /tabs/by-id/{id}/ssh-agent:
    post:
      tags: [tabs]
      summary: Give the tab its own ssh-agent
      description: >
        Enable or disable a per-tab `ssh-agent` so the tab holds a distinct
        SSH identity (or none) from other tabs. `enabled:true` respawns the
        shell with a dedicated `SSH_AUTH_SOCK`; an optional `key` path is
        auto-loaded with `ssh-add` (must be passphrase-less — encrypted keys
        are the user's job to `ssh-add` inside the tab). `enabled:false`
        respawns without the socket and reaps the agent. The shell restarts to
        apply, so the change is not instantaneous. Headless-daemon only — the
        desktop GUI refuses with 501. Under the hardened systemd unit a `key`
        path must be visible inside the daemon's mount namespace (e.g. under
        `/var/lib/tab-atelier`).
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean, default: true }
                key: { type: string, nullable: true, example: "/var/lib/tab-atelier/id_ed25519" }
      responses:
        "200":
          description: New state
          content:
            application/json:
              schema:
                type: object
                properties: { ssh_agent: { type: boolean } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Tab not found }
        "501": { description: Not supported on the desktop GUI (headless daemon only) }
  /tabs/by-id/{id}/view:
    get:
      tags: [tabs]
      summary: HTML share-link viewer (xterm.js)
      description: >
        Browser-facing terminal viewer. Authenticate with `?token=<share or
        master token>` (add `&ro=1` for a read-only link). A revoked or
        invalid token returns a 401 — an HTML page for browsers, JSON
        otherwise (content-negotiated on `Accept`).
      parameters:
        - $ref: "#/components/parameters/id"
        - name: token
          in: query
          schema: { type: string }
        - name: ro
          in: query
          schema: { type: integer, enum: [1] }
      responses:
        "200": { description: HTML viewer, content: { text/html: {} } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tabs/rotate-tokens:
    post:
      tags: [tokens]
      summary: Revoke all per-tab share tokens
      description: >
        Clears every tab's share_token_rw/ro — all outstanding share links
        401 immediately; a fresh token is minted on the next share. The
        master API token is untouched. Master token only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { type: object, properties: { revoked: { type: integer } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /master-token/reset:
    post:
      tags: [tokens]
      summary: Hot-swap the master API token
      description: >
        Generates a fresh master token, persists it to api.token, and
        publishes it live — every client/link carrying the OLD master token
        401s on its next request, no daemon restart. Master token only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: New token
          content:
            application/json:
              schema: { type: object, properties: { token: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { description: Could not persist token }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Master API token (`tab-atelier token`) or, on /tabs/by-id/*, a per-tab share token.
    shareToken:
      type: apiKey
      in: query
      name: token
      description: Per-tab share token (or master token) as a query parameter — used by share links.
  parameters:
    idx:
      name: idx
      in: path
      required: true
      schema: { type: integer }
      description: Tab index. Most by-index routes also accept the UUID form under /tabs/by-id/{id}/…
    id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Stable per-tab UUID.
  responses:
    Unauthorized:
      description: Invalid or missing token. HTML page for browsers (Accept text/html), JSON otherwise.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Share token is read-only.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties: { error: { type: string } }
    Tab:
      type: object
      properties:
        id: { type: string, format: uuid }
        index: { type: integer }
        name: { type: string }
        cwd: { type: [string, "null"] }
        active: { type: boolean }
        locked: { type: boolean }
        lock_reason: { type: [string, "null"], enum: [manual, schedule, null] }
        agent_state: { type: [string, "null"], enum: [thinking, waiting, error, null] }
        agent_kind: { type: [string, "null"] }
        led: { type: [string, "null"], enum: [dead, error, working, unreviewed, idle, null], description: "Fully-derived per-tab agent LED matching the desktop tab-strip dot; omitted when no dot should show" }
        last_used_at: { type: [integer, "null"], description: "Unix-millis of the last time this tab was used (input / activate / viewer open). Clients sort by this descending for a most-recently-used list. Omitted for never-used tabs" }
        context: { type: [string, "null"] }
        viewers: { type: integer, description: WS viewers currently watching this tab }
        watts: { type: [number, "null"] }
